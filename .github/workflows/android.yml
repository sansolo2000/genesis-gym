# Génesis Gym N (app nativa de Android) — compilación en la nube.
# Lo mantiene Desarrollador 3. Solo mira la carpeta android/: la 2.0 (PWA de la raíz) y GitHub Pages no se tocan.
#
# - Cada cambio en android/: corre las pruebas y compila. Si existen los secretos de firma, genera el APK firmado
#   y lo deja como archivo de la ejecución (no se publica).
# - Un commit cuyo mensaje empieza con "publicar android-v<versión>" (lo hace Desarrollador 3 solo con aprobación
#   de Héctor): además publica el APK como Release de GitHub y crea la etiqueta android-v<versión>.
#   (Esta sesión no puede subir etiquetas directamente: la política de red las rechaza.)
#
# Secretos (los carga solo Héctor, en Settings → Secrets and variables → Actions):
#   GG_KEYSTORE_BASE64  la llave (.jks) en base64
#   GG_KEYSTORE_PASSWORD, GG_KEY_ALIAS, GG_KEY_PASSWORD
name: Android (Génesis Gym N)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # solo se usa para crear el Release cuando el commit pide publicar
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4   # también valida que gradle-wrapper.jar sea el oficial

      - name: Pruebas automáticas
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a gradle.log

      - name: ¿Hay llave de firma?
        id: llave
        env:
          B64: ${{ secrets.GG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$B64" ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No están los secretos de firma: se compila sin generar APK. Héctor debe cargarlos (etapa E0)."
          fi

      - name: Compilar (sin firma, solo para comprobar)
        if: steps.llave.outputs.hay == 'no'
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a gradle.log

      - name: Compilar APK firmado
        if: steps.llave.outputs.hay == 'si'
        env:
          B64: ${{ secrets.GG_KEYSTORE_BASE64 }}
          GG_KEYSTORE_PASSWORD: ${{ secrets.GG_KEYSTORE_PASSWORD }}
          GG_KEY_ALIAS: ${{ secrets.GG_KEY_ALIAS }}
          GG_KEY_PASSWORD: ${{ secrets.GG_KEY_PASSWORD }}
        run: |
          export GG_KEYSTORE_PATH="$RUNNER_TEMP/llave.jks"
          echo "$B64" | base64 -d > "$GG_KEYSTORE_PATH"
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a gradle.log
          rm -f "$GG_KEYSTORE_PATH"
          V=$(grep '^versionName=' version.properties | cut -d= -f2)
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/genesis-gym-n-$V.apk"
          # Huella del certificado: se compara con la que anotó Héctor (no es secreta).
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "salida/genesis-gym-n-$V.apk" | grep -i 'SHA-256' | head -1
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Si algo falla, los errores de Gradle se publican como anotaciones del check (Desarrollador 3 no puede leer
      # los registros completos desde su sesión). gradle.log no contiene secretos: las llaves van por variables de entorno.
      - name: Errores como anotaciones
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          grep -E '^e: |error:|FAILED|What went wrong|Caused by|> ' gradle.log | grep -v 'Task :' | head -40 | while IFS= read -r l; do
            echo "::error::$(printf '%s' "$l" | cut -c1-900)"
          done

      - name: Guardar APK de la ejecución
        if: steps.llave.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-gym-n-${{ env.VERSION }}
          path: android/salida/*.apk
          retention-days: 30

      - name: Publicar Release (solo si el commit dice "publicar android-v<versión>")
        if: steps.llave.outputs.hay == 'si' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'publicar android-v')
        env:
          GH_TOKEN: ${{ github.token }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          ETIQUETA=$(printf '%s' "$MENSAJE" | head -1 | awk '{print $2}')
          if [ "$ETIQUETA" != "android-v$VERSION" ]; then
            echo "::error::El commit pide $ETIQUETA, pero android/version.properties dice versionName=$VERSION"; exit 1
          fi
          gh release create "$ETIQUETA" salida/*.apk --target "$GITHUB_SHA" \
            --title "Génesis Gym N $VERSION" \
            --notes "App nativa de prueba (Desarrollador 3). No reemplaza a la 1.0 ni a la 2.0. Instalar solo en los celulares de Héctor y Majo, con su aprobación." \
            --prerelease
